[package]
name = "rocketbase"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/bin/main.rs"
name = "rocketbase"


[dependencies]
pest = "2.8.1"
pest_derive = "2.8.1"
quote = "1.0.40"
sqlx = {version="0.8.6", features=["postgres", "runtime-tokio-rustls", "uuid", "chrono", "bigdecimal"]}
syn = "2.0.104"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
